<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belgian Government P&amp;L</title>
<style>
:root {
  --bg: #f7f7f5; --surface: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
  --border: #e3e3e0; --accent: #2457c5; --pos: #1d7a46; --neg: #b3261e;
  --row-total: #f0f2f7; --row-hover: #f5f7fb; --elim: #fbf6ec;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141416; --surface: #1c1c1f; --text: #ececee; --muted: #9a9aa2;
    --border: #2e2e33; --accent: #7aa2ff; --pos: #5cc98a; --neg: #ff8a80;
    --row-total: #24262d; --row-hover: #22242a; --elim: #2a261d;
  }
}
:root[data-theme="dark"] {
  --bg: #141416; --surface: #1c1c1f; --text: #ececee; --muted: #9a9aa2;
  --border: #2e2e33; --accent: #7aa2ff; --pos: #5cc98a; --neg: #ff8a80;
  --row-total: #24262d; --row-hover: #22242a; --elim: #2a261d;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 48px; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.seg.lang button { padding: 5px 10px; font-size: 12px; font-weight: 600; }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 0 0 20px; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; margin-bottom: 14px; }
.controls label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
select, button { font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
button { cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
.tabs button { border: 0; border-radius: 0; background: none; padding: 8px 12px; color: var(--muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
td.heat { background: color-mix(in srgb, var(--accent) calc(var(--h) * 38%), transparent); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { white-space: normal; min-width: 96px; max-width: 130px; font-size: 12px; font-weight: 600; color: var(--muted); text-align: right; vertical-align: bottom;
  position: sticky; top: 0; background: var(--surface); }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; }
th:first-child { z-index: 2; }
td { text-align: right; }
tr:hover td { background: var(--row-hover); }
tr.d0 td { background: var(--row-total); font-weight: 650; }
tr.d1 td { font-weight: 550; }
tr.d2 td { font-weight: 400; }
tr.other td { color: var(--muted); font-style: italic; }
td.elim, th.elim { background: var(--elim) !important; }
td.cons, th.cons { font-weight: 650; }
.tog { display: inline-block; width: 18px; color: var(--muted); cursor: pointer; user-select: none; }
.code { color: var(--muted); font-size: 11px; margin-left: 6px; }
.neg { color: var(--neg); }
sup.flag { color: var(--muted); font-size: 10px; margin-left: 2px; }
.notes { color: var(--muted); font-size: 12px; margin-top: 14px; }
.notes p { margin: 4px 0; }
@media (max-width: 640px) {
  th:first-child, td:first-child { white-space: normal; min-width: 150px; max-width: 170px; }
  td .code { display: none; }
  th, td { padding: 6px 8px; }
}
.empty { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header class="head">
    <div>
      <h1 data-i18n="title">Belgian general government — consolidated P&amp;L</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="seg lang" role="group" id="langs" aria-label="Language"></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Statement">
    <button data-stmt="pnl" aria-selected="true" data-i18n="tab_pnl">P&amp;L</button>
    <button data-stmt="cofog" aria-selected="false" data-i18n="tab_cofog">Expenditure by function</button>
    <button data-stmt="xfer" aria-selected="false" data-i18n="tab_xfer">Transfers between governments</button>
  </nav>

  <div class="controls">
    <div id="layoutCtl">
      <div class="seg" role="group" aria-label="Layout">
        <button data-view="cons" aria-pressed="true" data-i18n="by_sub">By subsector</button>
        <button data-view="ts" aria-pressed="false" data-i18n="over_time">Over time</button>
      </div>
    </div>
    <label id="yearCtl"><span data-i18n="year">Year</span> <select id="year"></select></label>
    <label id="sectorCtl" hidden><span data-i18n="sector">Sector</span> <select id="sector"></select></label>
    <label id="typeCtl" hidden><span data-i18n="flow">Flow</span> <select id="type"></select></label>
    <label><span data-i18n="unit">Unit</span> <select id="unit"></select></label>
    <label id="fromCtl" hidden><span data-i18n="from">From</span> <select id="from"></select></label>
    <div id="treeCtl"><button id="expand" data-i18n="expand">Expand all</button> <button id="collapse" data-i18n="collapse">Collapse all</button></div>
  </div>

  <div class="card"><div class="scroll"><table id="t"></table></div></div>

  <div class="notes" id="notes"></div>
</main>
<script>
const DATA = /*__DATA__*/null;
const $ = (id) => document.getElementById(id);
const SECT = Object.fromEntries(DATA.sectors.map(s => [s.code, s.labels]));
const storedLang = (() => { try { return localStorage.getItem("belpnl.lang"); } catch (e) { return null; } })();
const urlLang = new URLSearchParams(location.search).get("lang");
const navLang = (navigator.language || "en").slice(0, 2).toLowerCase();
let LANG = [urlLang, storedLang, navLang, "en"].find(l => l && DATA.langs.includes(l));
const T = (k, x) => (DATA.ui[LANG][k] || DATA.ui.en[k] || k).replace("{x}", x ?? "");
const L = (o) => o ? (o[LANG] || o.en) : "";
const state = { stmt: "pnl", view: "cons", unit: Object.keys(DATA.unitLabels)[0], year: null,
  sector: DATA.sectors[DATA.sectors.length - 1].code, from: null, type: "ALL", open: {} };

const ST = () => DATA.statements[state.stmt];
const U = () => ST().units[state.unit];
const yearsOf = () => state.stmt === "xfer"
  ? Object.keys(DATA.transfers[state.unit]).map(Number).sort((a, b) => a - b) : U().years;
for (const [k, st] of Object.entries(DATA.statements)) {
  st.byId = Object.fromEntries(st.lines.map(l => [l.id, l]));
  state.open[k] = new Set(st.lines.filter(l => l.depth === 0).map(l => l.id));
}

function fmt(v) {
  if (v === null || v === undefined) return "–";
  const dp = state.unit === "MIO_EUR" ? 0 : 1;
  const s = Math.abs(v).toLocaleString(DATA.numberLocales[LANG], { minimumFractionDigits: dp, maximumFractionDigits: dp });
  return v < 0 && /[1-9]/.test(s) ? "−" + s : s;
}
function visible(l) {
  let p = l.parent; const open = state.open[state.stmt];
  while (p) { if (!open.has(p)) return false; p = ST().byId[p].parent; }
  return true;
}
function columns() {
  if (state.view === "cons") {
    const cols = DATA.sectors.filter(s => s.kind === "sub").map(s => ({ key: s.code, year: state.year, label: L(s.labels) }));
    cols.push({ key: "SUM", year: state.year, label: T("sum_sub") });
    cols.push({ key: "ELIM", year: state.year, label: T("elim"), cls: "elim" });
    DATA.sectors.filter(s => s.kind === "cons").forEach(s => cols.push({ key: s.code, year: state.year, label: L(s.labels), cls: "cons" }));
    return cols;
  }
  return U().years.filter(y => y >= state.from).map(y => ({ key: state.sector, year: y, label: String(y) }));
}
const val = (c, id) => ((U().values[c.key] || {})[c.year] || {})[id];
function flagFor(l, c) {
  if (!l.item) return "";
  const f = (((U().flags || {})[c.key] || {})[c.year] || {})[l.item];
  return f ? `<sup class="flag" title="${T("flag")}">${f}</sup>` : "";
}
function shown(l, cols) {
  if (!l.other) return true;   // hide residual lines that are empty in the current table
  return cols.some(c => /[1-9]/.test(fmt(val(c, l.id))));
}
function renderStatement() {
  const u = U(), t = $("t"), cols = columns(), open = state.open[state.stmt];
  let h = `<thead><tr><th>${L(DATA.unitLabels[state.unit])}</th>${cols.map(c => `<th class="${c.cls || ""}">${c.label}</th>`).join("")}</tr></thead><tbody>`;
  for (const l of ST().lines) {
    if (!visible(l) || !shown(l, cols)) continue;
    const tog = l.hasKids ? `<span class="tog" data-id="${l.id}">${open.has(l.id) ? "▾" : "▸"}</span>` : `<span class="tog"></span>`;
    const code = l.item && state.stmt === "pnl" ? `<span class="code">${l.item}</span>` : "";
    h += `<tr class="d${Math.min(l.depth, 2)}${l.other ? " other" : ""}"><td style="padding-left:${8 + l.depth * 18}px">${tog}${L(l.labels)}${code}</td>`;
    for (const c of cols) {
      const v = val(c, l.id);
      const neg = v < 0 && /[1-9]/.test(fmt(v)) && (l.id === "RES" || l.id === "PRIM" || c.key === "ELIM") ? " neg" : "";
      h += `<td class="${c.cls || ""}${neg}">${fmt(v)}${flagFor(l, c)}</td>`;
    }
    h += "</tr>";
  }
  t.innerHTML = h + "</tbody>";
}
function renderTransfers() {
  const subs = DATA.sectors.filter(s => s.kind === "sub").map(s => s.code);
  const yr = (DATA.transfers[state.unit] || {})[state.year] || {};
  const types = state.type === "ALL" ? DATA.transferTypes.map(t => t.code) : [state.type];
  const m = {}; let max = 0;
  for (const p of subs) { m[p] = {}; for (const r of subs) {
    if (p === r) continue;
    let v = null; for (const t of types) { const x = ((yr[t] || {})[p] || {})[r]; if (x != null) v = (v || 0) + x; }
    m[p][r] = v; if (v > max) max = v;
  } }
  let h = `<thead><tr><th>${T("paid_by")}</th>${subs.map(r => `<th>${L(SECT[r])}</th>`).join("")}<th class="cons">${T("total_paid")}</th></tr></thead><tbody>`;
  const colTot = Object.fromEntries(subs.map(r => [r, 0]));
  for (const p of subs) {
    let rowTot = 0;
    h += `<tr><td>${L(SECT[p])}</td>`;
    for (const r of subs) {
      if (p === r) { h += `<td>·</td>`; continue; }
      const v = m[p][r]; rowTot += v || 0; colTot[r] += v || 0;
      h += `<td class="heat" style="--h:${max ? (v || 0) / max : 0}">${fmt(v)}</td>`;
    }
    h += `<td class="cons">${fmt(rowTot)}</td></tr>`;
  }
  const grand = Object.values(colTot).reduce((a, b) => a + b, 0);
  h += `<tr class="d0"><td>${T("total_received")}</td>${subs.map(r => `<td>${fmt(colTot[r])}</td>`).join("")}<td class="cons">${fmt(grand)}</td></tr>`;
  $("t").innerHTML = h + "</tbody>";
}
function render() {
  const xfer = state.stmt === "xfer";
  $("layoutCtl").hidden = $("treeCtl").hidden = xfer;
  $("typeCtl").hidden = !xfer;
  $("yearCtl").hidden = !xfer && state.view !== "cons";
  $("sectorCtl").hidden = $("fromCtl").hidden = xfer || state.view !== "ts";
  xfer ? renderTransfers() : renderStatement();
  notes();
}
function notes() {
  const runs = DATA.meta.runs.map(r => `<code>${r.source.split(":")[1]}</code> (${T("updated")} ${(r.source_updated || "").slice(0, 10)})`);
  const n = [T("source").replace("{geo}", DATA.meta.geo).replace("{runs}", runs.join(", "))];
  n.push(T(state.stmt + "_note1"), T(state.stmt + "_note2"));
  if (state.stmt !== "xfer") {
    const u = U();
    if (u.missing_items.length) n.push(T("missing", u.missing_items.join(", ")));
    if (state.stmt === "pnl" && u.checks.length) n.push(T("checks", u.checks.length));
  }
  $("notes").innerHTML = n.map(x => `<p>${x}</p>`).join("");
}
function refreshYears() {
  const ys = yearsOf();
  if (!ys.includes(state.year)) state.year = ys[ys.length - 1];
  $("year").innerHTML = ys.slice().reverse().map(y => `<option${y === state.year ? " selected" : ""}>${y}</option>`).join("");
  if (state.stmt !== "xfer") {
    if (!state.from || !ys.includes(state.from)) state.from = ys[Math.max(0, ys.length - 10)];
    $("from").innerHTML = ys.map(y => `<option${y === state.from ? " selected" : ""}>${y}</option>`).join("");
  }
}
function translate() {
  document.documentElement.lang = LANG;
  document.title = T("doc_title");
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = T(e.dataset.i18n));
  $("langs").setAttribute("aria-label", T("language"));
  $("langs").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === LANG));
  const opt = (v, text, sel) => `<option value="${v}"${v === sel ? " selected" : ""}>${text}</option>`;
  $("unit").innerHTML = Object.entries(DATA.unitLabels).map(([k, v]) => opt(k, L(v), state.unit)).join("");
  $("sector").innerHTML = DATA.sectors.slice().reverse().map(s => opt(s.code, L(s.labels), state.sector)).join("");
  $("type").innerHTML = opt("ALL", T("all_flows"), state.type) + DATA.transferTypes.map(t => opt(t.code, L(t.labels), state.type)).join("");
  const ys = DATA.statements.pnl.units[state.unit].years;
  $("subtitle").textContent = T("subtitle") + (ys.length ? ` · ${ys[0]}–${ys[ys.length - 1]}` : "");
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem("belpnl.lang", l); } catch (e) {}
  translate(); render();
}
function init() {
  if (!DATA.statements.cofog) document.querySelector('[data-stmt="cofog"]').remove();
  $("langs").innerHTML = DATA.langs.map(l => `<button data-lang="${l}">${l.toUpperCase()}</button>`).join("");
  $("langs").onclick = e => { if (e.target.dataset.lang) setLang(e.target.dataset.lang); };
  translate();
  refreshYears();

  document.querySelectorAll("[data-stmt]").forEach(b => b.onclick = () => {
    state.stmt = b.dataset.stmt;
    document.querySelectorAll("[data-stmt]").forEach(x => x.setAttribute("aria-selected", x === b));
    refreshYears(); render();
  });
  document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => {
    state.view = b.dataset.view;
    document.querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", x === b));
    render();
  });
  $("year").onchange = e => { state.year = +e.target.value; render(); };
  $("sector").onchange = e => { state.sector = e.target.value; render(); };
  $("from").onchange = e => { state.from = +e.target.value; render(); };
  $("type").onchange = e => { state.type = e.target.value; render(); };
  $("unit").onchange = e => { state.unit = e.target.value; refreshYears(); render(); };
  $("expand").onclick = () => { ST().lines.filter(l => l.hasKids).forEach(l => state.open[state.stmt].add(l.id)); render(); };
  $("collapse").onclick = () => { state.open[state.stmt].clear(); render(); };
  $("t").onclick = e => {
    const id = e.target.dataset && e.target.dataset.id; if (!id) return;
    const o = state.open[state.stmt]; o.has(id) ? o.delete(id) : o.add(id); render();
  };
  render();
}
if (!DATA.statements.pnl.units[state.unit].years.length) {
  document.querySelector("main").insertAdjacentHTML("beforeend", `<p class="empty">${T("no_data")} <code>python -m belpnl all</code>.</p>`);
} else init();
</script>
</body>
</html>
